<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bralni mentor</title>
<meta name="description" content="Meri čas branja, ohranjaj niz in rasti od novinca do razsvetljenega bralca.">
<meta name="theme-color" content="#ECEBE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bralni mentor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* bundled so the app looks the same offline: small subsets with the Slovene letters (see fonts/OFL.txt) */
@font-face{font-family:"Figtree"; src:url(fonts/figtree.woff2) format("woff2"); font-weight:400 700; font-style:normal; font-display:swap}
@font-face{font-family:"Newsreader"; src:url(fonts/newsreader-semibold.woff2) format("woff2"); font-weight:600; font-style:normal; font-display:swap}
/* ===== THEME: every colour, font, radius and shadow of the app lives here. Swap this one block to change the look. =====
   Washi (Jan's pick): stone-grey paper, ink, moss green; open sections without boxes; Figtree for the interface, Newsreader for titles and numbers.
   Muted, accent, good and mark are a shade darker than the picked swatches so all text meets WCAG AA (4.5:1) on the paper. */
:root{
  /* ground and text */
  --bg:#ECEBE4; --surface:#F6F5F0; --surface2:#D3D2C9; --line:#D3D2C9; --fg:#23241F; --muted:#62635B; --faint:#62635B;
  /* meanings: accent = what you press, good = goal reached, mark = bookmarks and records, under = minutes under the goal */
  --accent:#51664A; --accent-soft:rgba(81,102,74,.09); --on-accent:#FFFFFF;
  --good:#3B6747; --good-soft:rgba(59,103,71,.11); --on-good:#FFFFFF;
  --mark:#984835; --mark-soft:rgba(152,72,53,.09); --under:#8A8DA4; --danger:#984835; --rate:#9A6410;
  /* the level illustration: the reader growing up, the cat and the room (kid.js turns each --il-* into a fill and a stroke class) */
  --il-wall:#E3E1D6; --il-wall-shade:#D6D3C6; --il-floor:#CFC8B5; --il-floor-shade:#C0B8A3; --il-rug:#C6CBBB; --il-rug-2:#AEB5A4;
  --il-skin:#EDBE96; --il-skin-shade:#D39A72; --il-blush:#E58C7A; --il-lip:#A65A48; --il-ink:#2B2522;
  --il-hair:#5B3A29; --il-hair-grey:#A39C93; --il-hair-white:#ECE8E1;
  --il-cloth-1:#D8B55E; --il-cloth-2:#6A86AE; --il-cloth-2b:#F7F4EC; --il-cloth-3:#5B7150; --il-cloth-3d:#4A5D41; --il-cloth-4:#A5523F; --il-cloth-4d:#8A4334;
  --il-cloth-5:#DCE3EA; --il-cloth-6:#55607A; --il-cloth-7:#7E6A8C; --il-pants:#3A4A63; --il-pants-kid:#7C9CC9; --il-shoe:#2E2B29;
  --il-book:#A5523F; --il-book-2:#3F6FB5; --il-book-3:#4E8A5C; --il-book-4:#D9A441; --il-star:#F2C14E; --il-paper:#FBF8F1; --il-paper-line:#D3CABB;
  --il-wood:#A8865F; --il-wood-dark:#74563A; --il-chair:#7C8B6C; --il-chair-shade:#6B7A5D; --il-cushion:#C9A46B; --il-beanbag:#8D90A8; --il-blanket:#E2CDA8; --il-box:#C9A273;
  --il-window:#3E4A5E; --il-window-frame:#F3F1EA; --il-moon:#F6E7B4; --il-curtain:#A5523F; --il-plant:#5B7150; --il-plant-dark:#46593E; --il-pot:#B07A55;
  --il-cat:#E39B4F; --il-cat-shade:#C27A36; --il-cat-light:#F6E4CC; --il-cat-old:#CEC7BB; --il-nose:#D9787A;
  --il-lamp:#F2C14E; --il-light:rgba(240,205,140,.30); --il-beam:rgba(255,232,180,.36); --il-glow:rgba(255,214,140,.45);
  /* tier rings around the illustration, and locked levels */
  --tier-1:#A88566; --tier-2:#9EA3A6; --tier-3:#B8975A; --lock:#D3D2C9; --lock-bg:#E3E2DA;
  /* book covers without a photo */
  --cloth-1:#7A3B3F; --cloth-2:#36486E; --cloth-3:#4A5D41; --cloth-4:#7C6232; --cloth-5:#5A4A72; --cloth-6:#355F66; --foil:#F1DDB0;
  /* layers */
  --bar-bg:rgba(236,235,228,.94); --scrim:rgba(20,19,17,.38); --toast-bg:#23241F; --toast-fg:#ECEBE4; --party-bg:#ECEBE4;
  --shadow:0 10px 30px -18px rgba(0,0,0,.35); --shadow-up:0 -20px 50px -24px rgba(0,0,0,.3);
  /* the reading screen stays near black in every theme, so it can stay on beside the book */
  --reader-bg:#0C0C0D; --reader-fg:#D4D0C9; --reader-muted:#8A867E; --reader-track:#1B1B1D; --reader-ticks:#262628; --reader-ring:#6F8A62; --reader-done:#7FA86C;
  --reader-btn:#161618; --reader-btn-line:#2A2A2D; --reader-primary:#222A1F; --reader-primary-line:#3E5236; --reader-primary-fg:#C2D3B5;
  /* black screen while reading: pure black, so an OLED screen is as good as off, and the time barely visible */
  --reader-off:#000000; --reader-off-fg:#2E2E2E;
  /* date stamps: tilt 0 = straight, 1 = a few degrees crooked; mask = ink grain (none = clean) */
  --stamp-tilt:0; --stamp-mask:none;
  /* type and shape */
  --font:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --display:"Newsreader", Georgia, "Times New Roman", serif; --display-w:600;
  --num:var(--display); --num-w:600;   /* numerals: minutes, streak, records, clock */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --space:26px;
  /* surfaces: sections are open by default (space and one hairline); a theme can turn them into soft panels */
  --bg-paint:var(--bg); --panel-bg:transparent; --panel-r:0; --panel-pt:var(--space); --panel-px:0; --panel-pb:0; --panel-rule:1px solid var(--line); --sec-pt:var(--space);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
/* ===== end of theme ===== */
:root{--top:env(safe-area-inset-top, 0px); --bot:env(safe-area-inset-bottom, 0px)}
*{box-sizing:border-box}
html{scrollbar-color:var(--line) transparent}
html,body{margin:0; background:var(--bg-paint); color:var(--fg); font:16px/1.45 var(--font); font-synthesis-weight:none; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body{min-height:100vh; min-height:100dvh; caret-color:var(--accent)}
/* keeps scrolled content from running into the clock and battery in the status bar */
body::before{content:""; position:fixed; left:0; right:0; top:0; height:calc(var(--top) + 12px); background:var(--bg); opacity:.94; z-index:15; pointer-events:none}
::selection{background:var(--accent); color:var(--on-accent)}
button,input{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
button:disabled{cursor:default; opacity:.35}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display); font-weight:var(--display-w); line-height:1.15; letter-spacing:-.01em; text-wrap:balance}
h3{font-size:1rem; font-weight:650; line-height:1.25}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
[hidden]{display:none!important}

/* airy single column: sections are separated by space and one hairline, not boxes */
main{max-width:560px; margin:0 auto; padding:calc(var(--top) + 28px) max(20px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 110px) max(20px, env(safe-area-inset-left, 0px)); display:grid; gap:var(--space)}
.panel{background:var(--panel-bg); border-radius:var(--panel-r); border-top:var(--panel-rule); padding:var(--panel-pt) var(--panel-px) var(--panel-pb)}
.sec{display:flex; align-items:baseline; gap:8px; font-family:var(--display); font-weight:var(--display-w); font-size:1.12rem; border-top:var(--panel-rule); padding-top:var(--sec-pt); margin-bottom:-10px}
.sec span{font-family:var(--font); font-weight:500; font-size:.9rem; color:var(--muted)}
.title{font-size:1.9rem; margin-bottom:-8px}
.lede{color:var(--muted); font-size:.95rem}
.demo{justify-self:start; font-size:.75rem; color:var(--muted); border:1px dashed var(--line); border-radius:var(--r-pill); padding:3px 10px; margin-bottom:-10px}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:12px 16px; font-weight:650; width:100%; transition:transform .15s var(--ease), background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.ghost{background:transparent; border-color:transparent}
.btn.armed{background:var(--danger); border-color:var(--danger); color:var(--on-accent)}
.btns{display:grid; gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.link{background:none; border:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; min-height:44px; padding:8px 4px}
.del{background:none; border:0; color:var(--danger); font-weight:600; min-height:44px; padding:10px; justify-self:center}
.del.armed{background:var(--danger); color:var(--on-accent); border-radius:var(--r-sm); padding-inline:18px}
.add{display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border:0; background:transparent; border-radius:var(--r-md); color:var(--accent); font-weight:650; width:100%}

/* the level illustration: a room with the reader and the cat, coloured entirely by the theme (--il-*) */
.kid{display:block; flex:none; border-radius:calc(var(--r-lg) * 1.4)}
.kid .k-bg{fill:var(--il-wall)}
.kid .k-ring{fill:none; stroke-width:3}
.kid.t1 .k-ring{stroke:var(--tier-1)} .kid.t2 .k-ring{stroke:var(--tier-2)} .kid.t3 .k-ring{stroke:var(--tier-3)}
.kid .page{opacity:0}
/* locked levels: the room is hidden, the reader and the cat are a silhouette */
.kid.locked .k-bg{fill:var(--lock-bg)}
.kid.locked .k-ring{stroke:var(--line)}
.kid.locked .room,.kid.locked .glow{display:none}
.kid.locked .fig [class*="f-"]{fill:var(--lock)!important; fill-opacity:1!important; opacity:1!important}
.kid.locked .fig [class*="s-"]{stroke:var(--lock)!important; opacity:1!important}
/* gentle life, only on the drawings marked live: breathing, blinking, a page turning, a cat's tail, dust in the light */
.kid.live .breath{animation:breath 4.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.kid.live .blink{animation:blink 6.2s infinite; transform-box:fill-box; transform-origin:50% 50%}
.kid.live .page{animation:page 7.5s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 50%}
.kid.live .tail{animation:tail 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 100%}
.kid.live .snooze{animation:breath 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.kid.live .steam{animation:steam 3s ease-in-out infinite}
.kid.live .aura{animation:aura 5s ease-in-out infinite}
.kid.live .mote{animation:mote 6s linear infinite}
.kid-wrap{position:relative; display:inline-block; line-height:0; border-radius:calc(var(--r-lg) * 1.4)}
.kid-wrap.glow-new{animation:halo 2.8s ease-in-out infinite}
/* level up: the old stage fades into light, the new one grows out of it */
.morph{position:relative; display:grid; place-items:center}
.morph > *{grid-area:1/1}
.morph .old{animation:morph-out 1s .3s var(--ease) both}
.morph .new{animation:morph-in 1.3s 1s var(--ease) both}
.morph .burst{width:200px; height:200px; border-radius:50%; border:3px solid var(--tier-3); background:radial-gradient(circle, var(--il-glow) 0, transparent 68%); opacity:0; animation:burst 1.2s .85s var(--ease) both}

/* level header */
.lvl{display:grid; grid-template-columns:132px minmax(0,1fr); gap:16px; align-items:center; background:none; border:0; padding:0; text-align:left; width:100%; color:inherit}
.lvl h1{font-size:1.6rem}
.lvl .meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:.85rem; color:var(--muted); margin:4px 0 12px}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:.75rem; font-weight:650; border-radius:var(--r-pill); padding:2px 9px; white-space:nowrap}
.chip.new{background:var(--accent); color:var(--on-accent)}
.chip.pr{background:var(--mark-soft); color:var(--mark)}
.chip.st{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line)}
.trackrow{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px}
.track{height:6px; border-radius:var(--r-pill); background:var(--surface2); overflow:hidden}
.track i{display:block; height:100%; border-radius:var(--r-pill); background:var(--accent); transition:width .8s var(--ease)}
.sub{font-size:.85rem; color:var(--muted); margin-top:8px}
.sub b{color:var(--fg); font-weight:600}

/* today */
.today{display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px; align-items:center}
.today h2{font-size:1.25rem; margin-bottom:3px}
.today p{color:var(--muted)}
.today p b{color:var(--fg); font-weight:600}
.ring .trk{fill:none; stroke:var(--surface2); stroke-width:4}
.ring .arc{fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .8s var(--ease)}
.ring .num1{fill:var(--fg); font:var(--num-w) 20px var(--num)}
.ring .u{fill:var(--muted); font:600 8.5px var(--font)}
.ring.done .arc{stroke:var(--good)}
.ring .tickdisc{transform-origin:32px 32px; animation:press .8s var(--ease) both}

/* streak: one slot per day like a due-date card; a goal day is stamped with its date */
.streak{position:relative}
.streak-top{display:flex; align-items:baseline; gap:8px; padding-right:84px}
.streak-top b{font:var(--num-w) 2.4rem/1 var(--num); font-variant-numeric:tabular-nums}
.streak-top span{font-weight:600}
.marks{position:absolute; top:calc(var(--panel-pt) - 1px); right:var(--panel-px); display:flex; gap:7px}
.marks svg{width:16px; height:36px; display:block}
.hint{font-size:.85rem; color:var(--muted); margin-top:8px; max-width:46ch}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:18px}
.wd{display:grid; justify-items:center; gap:7px; font-size:.75rem; color:var(--muted)}
.wd.is-today{color:var(--fg); font-weight:700}
.slot{display:grid; place-items:center; width:42px; height:32px; font:var(--num-w) .72rem/1 var(--num); font-variant-numeric:tabular-nums; border-radius:var(--r-sm)}
.slot.blank{color:var(--faint); border-bottom:1.5px dashed var(--line); border-radius:0}
.slot.open{color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent)}
.stamp{color:var(--good); background:var(--good-soft); transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))); -webkit-mask:var(--stamp-mask) center/100% 100%; mask:var(--stamp-mask) center/100% 100%}
.stamp.saved{color:var(--mark); background:var(--mark-soft); grid-auto-flow:column; column-gap:2px}
.stamp.saved svg{width:6px; height:11px}
.stamp.thunk{animation:thunk .7s var(--ease) both}

/* books: a plain list with hairlines */
.books{display:grid}
.book{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; background:none; border:0; border-bottom:1px solid var(--line); padding:14px 0; text-align:left; width:100%; cursor:pointer; color:inherit}
.book h3{overflow-wrap:anywhere}
.book p{font-size:.85rem; color:var(--muted)}
.book .t{color:var(--fg); opacity:.8}
.cover{border-radius:3px 5px 5px 3px; object-fit:cover; flex:none; overflow:hidden; display:block; box-shadow:var(--shadow)}
.cloth{position:relative; display:grid; place-items:center; color:var(--foil); font-family:var(--display); font-weight:var(--display-w); letter-spacing:.02em}
.cloth::before{content:""; position:absolute; left:0; top:0; bottom:0; width:12%; background:rgba(0,0,0,.22)}
.cloth::after{content:""; position:absolute; left:22%; right:10%; top:16%; bottom:16%; border-top:1px solid currentColor; border-bottom:1px solid currentColor; opacity:.45}
.cloth span{position:relative; padding-left:8%}
.play{width:46px; height:46px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; transition:transform .15s var(--ease)}
.play:active{transform:scale(.94)}
.play svg{width:18px; height:18px; margin-left:3px}
.empty{display:grid; justify-items:center; text-align:center; gap:10px; padding-bottom:6px}
.empty .kid{margin-bottom:4px}
.empty h2{font-size:1.25rem}
.empty p{color:var(--muted); max-width:30ch}
.empty .btn{margin-top:6px}
.wall{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px 14px; margin-top:6px}
.shelf{position:relative; display:grid; gap:6px; align-content:start; background:none; border:0; padding:0; text-align:left; color:inherit; cursor:pointer}
.shelf .cover{width:100%; height:auto; aspect-ratio:1/1.45}
.shelf .done-stamp{position:absolute; top:10px; right:-4px; color:var(--mark); background:var(--surface); padding:4px 6px; font:var(--display-w) .62rem/1.15 var(--display); text-align:center; letter-spacing:.04em; border-radius:6px; box-shadow:inset 0 0 0 1.5px currentColor; transform:rotate(calc(8deg * var(--stamp-tilt))); -webkit-mask:var(--stamp-mask) center/100% 100%; mask:var(--stamp-mask) center/100% 100%}
.shelf b{font-size:.85rem; font-weight:650; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.shelf small{font-size:.75rem; color:var(--muted); margin-top:-3px}
.shelf-empty{color:var(--muted); font-size:.9rem; padding:4px 0 0}

/* install */
.install{background:var(--accent-soft); border-radius:var(--r-lg); padding:18px; display:grid; gap:10px}
.install h2{font-size:1.08rem}
.install p{font-size:.92rem}

/* progress */
.rec{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.rec:first-child{padding-top:0}
.rec:last-child{border-bottom:0; padding-bottom:0}
.rec span{color:var(--muted); display:flex; align-items:center; gap:8px}
.rec b{font:var(--num-w) 1.25rem var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.head h2{font-size:1.15rem}
.chart svg{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font:600 11px var(--font)}
.chart .v{fill:var(--fg); font:var(--num-w) 12px var(--num)}
.chart .g{fill:var(--accent); font:600 11px var(--font)}
.cal-head{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; text-align:center; margin-bottom:12px}
.cal-head h2{font-size:1.1rem}
.cal-head button{background:none; border:1px solid var(--line); border-radius:var(--r-sm); width:44px; height:44px; display:grid; place-items:center}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.cal .h{font-size:.75rem; color:var(--muted); padding-bottom:4px}
.cal .c{position:relative; aspect-ratio:1; border-radius:var(--r-sm); display:grid; place-items:center; font-size:.85rem; font-variant-numeric:tabular-nums; color:var(--muted); max-width:42px; width:100%; justify-self:center}
.cal .c i{position:absolute; left:50%; bottom:9%; transform:translateX(-50%); border-radius:50%; background:var(--under)}
.cal .c.tick{color:var(--good); background:var(--good-soft); font:var(--num-w) .85rem var(--num); transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))) scale(.88)}
.cal .c.saved{color:var(--mark); background:var(--mark-soft); transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))) scale(.88)}
.cal .c.saved svg{position:absolute; top:-3px; right:3px; width:7px; height:12px}
.cal .c.miss{color:var(--faint)}
.cal .c.open,.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--accent); color:var(--fg); font-weight:700; border-radius:50%}
.cal .c.future{opacity:.38}
.month{display:grid; grid-template-columns:1fr 1fr; gap:0 18px; margin:2px 0 18px}
.month div{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line)}
.month span{font-size:.82rem; color:var(--muted)}
.month b{font:var(--num-w) 1.02rem var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.cal .c.zero{color:var(--faint)}
.cal .c.zero::after{content:""; position:absolute; left:34%; right:34%; bottom:14%; height:1.5px; border-radius:2px; background:var(--line)}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:.78rem; color:var(--muted); margin-top:14px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{display:inline-block; width:12px; height:12px; border-radius:4px}
/* the level roster: one cell per stage of the kid, name plate, hours and a one-line note */
.tier{margin-top:22px}
.head + .tier{margin-top:8px}
.tier-h{display:flex; align-items:center; gap:8px; font-size:.85rem; font-weight:650; margin-bottom:10px}
.tier-h i{width:10px; height:10px; border-radius:50%}
.tier-h small{color:var(--muted); font-weight:500; margin-left:auto; font-variant-numeric:tabular-nums}
.roster{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.cell{display:grid; justify-items:center; align-content:start; gap:5px; text-align:center; padding:14px 8px; border-radius:var(--r-lg)}
.cell b{font-family:var(--display); font-size:.98rem; font-weight:var(--display-w); line-height:1.2; text-wrap:balance}
.cell small{font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums}
.cell em{font-style:normal; font-size:.78rem; line-height:1.3; color:var(--muted); text-wrap:balance}
.cell.now{background:var(--accent-soft)}
.cell.now small{color:var(--accent); font-weight:650}
.cell.locked b{color:var(--faint)}
.goal{display:grid; grid-template-columns:52px minmax(0,1fr) 52px; gap:10px; align-items:center; text-align:center}
.goal button{height:52px; border-radius:var(--r-md); border:1px solid var(--line); background:none; display:grid; place-items:center}
.goal b{font:var(--num-w) 2rem var(--num)}
.row{display:flex; gap:10px; align-items:center; justify-content:space-between}
/* on/off switch: an outlined track when off, filled with the accent when on */
.switch{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; width:100%; min-height:48px; background:none; border:0; padding:0; text-align:left; color:var(--fg); font-weight:600}
.switch i{position:relative; width:48px; height:28px; border-radius:var(--r-pill); box-shadow:inset 0 0 0 1.5px var(--muted); transition:background .2s, box-shadow .2s}
.switch i::after{content:""; position:absolute; top:5px; left:5px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .25s var(--ease), background .2s}
.switch[aria-checked="true"] i{background:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent)}
.switch[aria-checked="true"] i::after{transform:translateX(20px); background:var(--on-accent)}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(3, minmax(0, 186px)); justify-content:center; background:var(--bar-bg); -webkit-backdrop-filter:blur(14px) saturate(1.2); backdrop-filter:blur(14px) saturate(1.2); border-top:1px solid var(--line); padding:4px max(8px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 4px) max(8px, env(safe-area-inset-left, 0px))}
.tabs button{position:relative; background:none; border:0; display:grid; justify-items:center; gap:3px; font-size:.75rem; font-weight:600; color:var(--muted); padding:9px 0 7px; min-height:52px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px; height:24px}

/* bottom sheet */
.scrim{position:fixed; inset:0; z-index:30; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease-out}
.sheet{position:relative; background:var(--surface); border-radius:var(--r-lg) var(--r-lg) 0 0; width:100%; max-width:560px; max-height:92vh; max-height:92dvh; overflow:auto; padding:28px max(20px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 24px) max(20px, env(safe-area-inset-left, 0px)); display:grid; gap:16px; box-shadow:var(--shadow-up); animation:rise .38s var(--ease)}
.sheet::before{content:""; position:absolute; top:9px; left:50%; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:var(--line)}
.sheet h2{font-size:1.3rem}
.sheet label{display:grid; gap:6px; font-size:.85rem; color:var(--muted); font-weight:600}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{background:var(--bg); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 12px; font-size:1rem; font-weight:400; color:var(--fg); width:100%; min-height:48px}
.sheet input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.photo{border:1.5px dashed var(--line); border-radius:var(--r-md); padding:14px; display:flex!important; align-items:center; gap:14px; color:var(--accent)!important; font-weight:650!important; font-size:1rem!important; cursor:pointer}
.photo img{width:64px; height:92px; object-fit:cover; border-radius:3px 5px 5px 3px}
.err{color:var(--danger); font-size:.9rem}
.detail{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center}
.detail h2{overflow-wrap:anywhere}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:0; margin:0; border-top:1px solid var(--line)}
.facts div{padding:10px 2px; border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){border-right:1px solid var(--line); padding-right:10px}
.facts div:nth-child(even){padding-left:12px}
.facts dt{font-size:.75rem; color:var(--muted)}
.facts dd{margin:2px 0 0; font:var(--num-w) 1.02rem var(--num); font-variant-numeric:tabular-nums}
.danger-zone{display:grid; border-top:1px solid var(--line); margin-top:8px; padding-top:8px}

/* reading screen: near black so the screen can stay on beside the book */
.reader{position:fixed; inset:0; z-index:40; background:var(--reader-bg); color:var(--reader-muted); display:grid; grid-template-rows:auto 1fr auto; justify-items:center; align-items:center; gap:20px; text-align:center; padding:calc(var(--top) + 22px) 24px calc(var(--bot) + 30px)}
.rd-top{display:grid; justify-items:center; gap:10px; max-width:100%}
.rd-top .cover{opacity:.72}
.rd-book{font:var(--display-w) 1.12rem var(--display); color:var(--reader-fg); overflow-wrap:anywhere}
.live{display:inline-flex; align-items:center; gap:7px; font-size:.8rem; font-weight:600; color:var(--reader-muted)}
.live i{width:8px; height:8px; border-radius:50%; background:var(--reader-ring)}
.live.off i{background:none; box-shadow:inset 0 0 0 1.5px var(--reader-muted)}
.rd-ring{position:relative; width:min(74vw, 300px); aspect-ratio:1}
.rd-ring svg{width:100%; height:100%; overflow:visible}
.rd-ring .trk{fill:none; stroke:var(--reader-track); stroke-width:3}
.rd-ring .ticks{fill:none; stroke:var(--reader-ticks); stroke-width:1.4; stroke-dasharray:.6 4.4265}
.rd-ring .arc{fill:none; stroke:var(--reader-ring); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset 1s linear}
.rd-ring .arc.done{stroke:var(--reader-done)}
.rd-mid{position:absolute; inset:0; display:grid; place-content:center; gap:6px}
.rd-mid b{font:var(--num-w) clamp(2.9rem, 15vw, 4.4rem)/1 var(--num); color:var(--reader-fg); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.rd-mid span{font-size:.85rem; color:var(--reader-muted)}
.rd-today{font-size:.95rem; display:inline-flex; align-items:center; gap:8px}
.rd-today.done{color:var(--reader-done)}
.reader .btns{width:min(100%, 360px)}
.reader .btn{background:var(--reader-btn); border-color:var(--reader-btn-line); color:var(--reader-fg)}
.reader .btn.primary{background:var(--reader-primary); border-color:var(--reader-primary-line); color:var(--reader-primary-fg)}
.rd-box{display:grid; gap:14px; width:min(100%, 360px)}
.rd-box p{color:var(--reader-fg)}
.reader .link{color:var(--reader-muted)}
.reader .link.armed{color:var(--reader-fg); text-decoration-color:var(--danger)}
.rd-ask{position:absolute; inset:0; background:var(--reader-bg); display:grid; place-content:center; gap:16px; padding:24px}
.rd-ask p{font:var(--display-w) 1.7rem var(--display); color:var(--reader-fg)}
.rd-ask small{color:var(--reader-muted); max-width:30ch; justify-self:center; font-size:.85rem}
.rd-ask .btns{width:min(100%, 320px); justify-self:center}
.rd-lead{color:var(--reader-fg); font-size:1.02rem; max-width:26ch; justify-self:center}
.rd-note{font-size:.82rem; color:var(--reader-muted); margin-top:-8px; max-width:34ch}
/* black screen: pure black over everything, only the time barely visible; it fades in slowly and is gone at once on a tap */
.rd-black{position:absolute; inset:0; z-index:5; display:grid; place-items:end center; border:0; padding:0 0 calc(var(--bot) + 16vh); background:var(--reader-off); color:var(--reader-off-fg); font:500 .8rem var(--font); cursor:default; opacity:0; visibility:hidden}
.reader.dark .rd-black{opacity:1; visibility:visible; transition:opacity 1.6s ease}
.rd-black:focus-visible{outline:none}

/* toast + celebrations */
.toast{position:fixed; left:50%; bottom:calc(var(--bot) + 88px); transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:10px; background:var(--toast-bg); color:var(--toast-fg); border-radius:var(--r-md); padding:12px 16px; width:max-content; max-width:calc(100% - 32px); box-shadow:var(--shadow); animation:up .38s var(--ease)}
.toast svg{width:24px; height:24px; flex:none}
.party{position:fixed; inset:0; z-index:70; background:var(--party-bg); display:grid; place-content:center; justify-items:center; gap:12px; text-align:center; padding:24px}
.party h2{font-size:2rem; max-width:14ch}
.party p{color:var(--muted); max-width:32ch}
.party .btn{width:auto; padding-inline:40px; margin-top:10px}
.hero{position:relative; display:grid; place-items:center; width:220px; height:220px; margin-bottom:6px}
.hero > *{grid-area:1/1}
.spark{position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:2px; opacity:0; animation:spark 1.2s .25s var(--ease) both}
.hero .cover{animation:press .9s var(--ease) both}
.hero .big-stamp{--r:-9deg; align-self:end; margin-bottom:26px; color:var(--mark); background:var(--surface); font:var(--display-w) 1.2rem/1.1 var(--display); letter-spacing:.06em; padding:8px 14px 7px; border-radius:var(--r-sm); box-shadow:inset 0 0 0 2px currentColor, var(--shadow); transform:rotate(calc(var(--r) * var(--stamp-tilt))); -webkit-mask:var(--stamp-mask) center/100% 100%; mask:var(--stamp-mask) center/100% 100%; animation:thunk .75s .55s var(--ease) both}
.hero .big-stamp small{display:block; font-size:.72rem; letter-spacing:.02em}
@keyframes up{from{opacity:0; transform:translate(-50%, 14px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px); opacity:.4}}
@keyframes press{0%{transform:scale(1.25); opacity:0} 55%{transform:scale(.97); opacity:1} 100%{transform:scale(1)}}
@keyframes thunk{0%{transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))) scale(1.8); opacity:0} 55%{transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))) scale(.93); opacity:1} 100%{transform:rotate(calc(var(--r, 0deg) * var(--stamp-tilt))) scale(1)}}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 transparent} 50%{box-shadow:0 0 0 7px var(--accent-soft)}}
@keyframes spark{0%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:0; transform:translate(var(--dx), var(--dy)) rotate(200deg)}}
@keyframes breath{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.012,1.024)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)}}
@keyframes page{0%,72%{opacity:0; transform:scaleX(1)} 74%{opacity:1; transform:scaleX(1)} 88%{opacity:1; transform:scaleX(-1)} 90%,100%{opacity:0; transform:scaleX(-1)}}
@keyframes tail{0%,100%{transform:rotate(0)} 50%{transform:rotate(-14deg)}}
@keyframes steam{0%,100%{opacity:.25; transform:translateY(0)} 50%{opacity:.8; transform:translateY(-2px)}}
@keyframes aura{0%,100%{opacity:.7} 50%{opacity:1}}
@keyframes mote{0%{opacity:0; transform:translateY(0)} 25%{opacity:1} 100%{opacity:0; transform:translateY(-34px)}}
@keyframes morph-out{0%{opacity:1; transform:scale(1); filter:none} 100%{opacity:0; transform:scale(1.08); filter:blur(6px) brightness(1.7)}}
@keyframes morph-in{0%{opacity:0; transform:scale(.84); filter:blur(5px) brightness(2)} 60%{opacity:1; transform:scale(1.04); filter:blur(0) brightness(1.15)} 100%{opacity:1; transform:scale(1); filter:none}}
@keyframes burst{0%{opacity:0; transform:scale(.4)} 30%{opacity:1} 100%{opacity:0; transform:scale(1.5)}}
/* ===== friends (Bralni mentor 2): reading clubs, the weekly board, the chat ===== */
.tabs{grid-template-columns:repeat(4, minmax(0, 140px))}
.tabs button.has-dot::after{content:""; position:absolute; top:8px; left:calc(50% + 9px); width:8px; height:8px; border-radius:50%; background:var(--mark); box-shadow:0 0 0 2px var(--bg)}
.version{font-size:.75rem; color:var(--muted); text-align:center; max-width:40ch; justify-self:center; margin-top:-6px}
.code{font-family:var(--display); font-weight:var(--display-w); letter-spacing:.12em; text-transform:uppercase}
.bigcode{font:var(--num-w) 2.2rem/1 var(--num); letter-spacing:.16em; text-align:center; padding:6px 0 2px; color:var(--fg)}
.transfer{font:600 .82rem/1.5 ui-monospace, Menlo, Consolas, monospace; background:var(--bg); border:1px dashed var(--line); border-radius:var(--r-sm); padding:12px; overflow-wrap:anywhere; user-select:all; -webkit-user-select:all}
.iconbtn{width:44px; height:44px; flex:none; display:grid; place-items:center; border:1px solid var(--line); border-radius:var(--r-sm); background:none; color:var(--fg)}
.fr-trio{display:flex; justify-content:center; margin-bottom:4px}
.fr-trio .kid{border-radius:50%; box-shadow:0 0 0 4px var(--bg)}
.fr-trio .kid + .kid{margin-left:-18px}
.fr-trio .kid:nth-child(2){transform:translateY(-8px); position:relative; z-index:1}
.fr-form{display:grid; gap:14px}
.fr-form label,.sheet label{display:grid; gap:6px; font-size:.85rem; color:var(--muted); font-weight:600}
.fr-form input,.sheet .fr-set input{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:13px 12px; font-size:1rem; font-weight:400; color:var(--fg); width:100%; min-height:48px}
.sheet .fr-set input{background:var(--bg)}
.fr-form input:focus,.compose textarea:focus,.sheet .fr-set input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.fr-form input.code,#fr-code{font-size:1.4rem; letter-spacing:.3em; text-transform:uppercase; text-align:center}
.fr-form .link{justify-self:center}
.fr-invite{display:grid; justify-items:center; text-align:center; gap:8px}
.fr-invite h2{font-size:1.3rem}
.fr-invite .hint{text-align:left}
.fr-how h2{font-size:1.15rem; margin-bottom:10px}
.fr-how ol{margin:0; padding-left:1.2em; display:grid; gap:8px}
.fr-how li::marker{color:var(--accent); font-weight:700}
.fr-how .link{padding-left:0; margin-top:6px}
.fr-chips{display:flex; gap:8px; overflow-x:auto; margin:-6px -20px -12px; padding:2px 20px 4px; scrollbar-width:none}
.fr-chips button{position:relative; flex:none; min-height:40px; padding:8px 14px; border-radius:var(--r-pill); border:1px solid var(--line); background:none; font-weight:600; font-size:.88rem; color:var(--muted)}
.fr-chips button[aria-selected="true"]{background:var(--fg); border-color:var(--fg); color:var(--bg)}
.fr-chips .dot{position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--mark)}
.fr-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.fr-head .title{overflow-wrap:anywhere}
.fr-head .lede{margin-top:12px}
.fr-top{display:grid; gap:14px}
.seg{display:grid; grid-template-columns:1fr 1fr; padding:3px; border-radius:var(--r-md); background:var(--surface2)}
.seg button{min-height:40px; border:0; border-radius:calc(var(--r-md) - 3px); background:none; font-weight:650; color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fr-range{font-size:.82rem; color:var(--muted); margin-bottom:-6px}
.fr-wait{padding:18px 0}
.fr-board{display:grid}
.fr-row{display:grid; grid-template-columns:22px 52px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; background:none; border:0; border-bottom:1px solid var(--line); padding:12px 0; text-align:left; color:inherit; cursor:pointer}
.fr-row.me{background:var(--accent-soft); border-radius:var(--r-md); border-bottom-color:transparent; margin:0 -10px; padding:12px 10px; width:calc(100% + 20px)}
.fr-place{font:var(--num-w) 1.15rem var(--num); color:var(--muted); text-align:center; font-variant-numeric:tabular-nums}
.fr-kid{line-height:0}
.fr-kid .kid{border-radius:50%}
.fr-main{display:grid; gap:5px; min-width:0}
.fr-name{display:flex; align-items:center; gap:6px; min-width:0}
.fr-name b{font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fr-name small{font-size:.72rem; color:var(--accent); font-weight:700}
.crown{width:18px; height:13px; flex:none}
.chip.live{background:var(--good-soft); color:var(--good); padding:1px 8px 1px 6px}
.chip.live i{width:7px; height:7px; border-radius:50%; background:var(--good); animation:livepulse 1.6s ease-in-out infinite}
.fr-sub{font-size:.8rem; color:var(--muted)}
.fr-wk{display:flex; gap:3px}
.fr-wk i{position:relative; width:14px; height:14px; border-radius:4px; box-shadow:inset 0 0 0 1.5px var(--line)}
.fr-wk i.read{background:var(--good); box-shadow:none}
.fr-wk i.short::after{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--under)}
.fr-wk i.open{box-shadow:inset 0 0 0 1.5px var(--accent)}
.fr-wk i.open::after{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--accent); opacity:.5}
.fr-wk i.miss{background:var(--mark-soft); box-shadow:none}
.fr-wk i.miss::after{content:""; position:absolute; left:3px; right:3px; top:6px; height:2px; border-radius:1px; background:var(--mark); opacity:.75}
.fr-wk i.future{opacity:.45; box-shadow:inset 0 0 0 1px var(--line)}
.fr-wk i.before{box-shadow:none; background:repeating-linear-gradient(135deg, var(--line) 0 1.5px, transparent 1.5px 4px); opacity:.6}
.fr-row .fr-wk + .fr-sub{margin-top:-1px}
.fr-pts{display:grid; justify-items:end; line-height:1.1}
.fr-pts b{font:var(--num-w) 1.45rem var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.fr-pts small{font-size:.72rem; color:var(--muted)}
.fr-win{display:flex; align-items:center; gap:8px; font-size:.88rem; color:var(--muted)}
.fr-win b{color:var(--fg)}
.fr-rules summary{cursor:pointer; color:var(--accent); font-weight:650; min-height:44px; display:flex; align-items:center; list-style:none}
.fr-rules summary::-webkit-details-marker{display:none}
.fr-rules summary::after{content:"+"; margin-left:8px; font-weight:500}
.fr-rules[open] summary::after{content:"–"}
.fr-rules dl{display:grid; margin:8px 0 0; border-top:1px solid var(--line)}
.fr-rules dl div{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.92rem}
.fr-rules dd{margin:0; font:var(--num-w) 1rem var(--num); white-space:nowrap; text-align:right}
.fr-rules .hint{max-width:none}
.fr-chat .head{margin-bottom:14px}
.fr-chat > .link{display:block; margin:-6px auto 6px}
.feed{display:grid; gap:12px}
.msg{justify-self:start; max-width:86%; background:var(--surface); border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px; padding:10px 14px 6px; display:grid; gap:2px}
.msg.mine{justify-self:end; background:var(--accent-soft); border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
.msg-h{display:flex; align-items:baseline; gap:8px; font-size:.8rem}
.msg-h b{font-weight:700}
.msg-h time,.ev time{color:var(--muted); font-size:.75rem; font-variant-numeric:tabular-nums}
.msg-b{white-space:pre-wrap; overflow-wrap:anywhere}
.quote{font-size:.8rem; color:var(--muted); border-left:2px solid var(--line); padding-left:8px; margin:2px 0 4px; overflow-wrap:anywhere}
.msg-acts{display:flex; align-items:center; gap:2px; margin-left:-8px}
.bravo,.re-btn,.del-msg{display:inline-flex; align-items:center; gap:5px; min-height:36px; padding:6px 8px; border:0; background:none; border-radius:var(--r-pill); font-size:.78rem; font-weight:650; color:var(--muted)}
.bravo svg{width:15px; height:15px}
.bravo.on{color:var(--mark)}
.re-btn .ic{width:16px; height:16px}
.del-msg{margin-left:auto; font-weight:500}
.del-msg.armed{background:var(--danger); color:var(--on-accent)}
.ev{display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 10px; align-items:center; padding:2px 0}
.ev > svg{width:34px; height:34px}
.ev-kid{line-height:0}
.ev-kid .kid{border-radius:50%}
.ev p{font-size:.9rem; color:var(--fg)}
.ev p i{font-style:normal; font-weight:650}
.ev time{display:block}
.ev .msg-acts{grid-column:2; margin-top:-4px}
.replying{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:.82rem; color:var(--muted); border-left:2px solid var(--accent); padding-left:10px; margin-top:14px}
.replying .link{min-height:36px}
.compose{display:grid; grid-template-columns:minmax(0,1fr) 48px; gap:8px; align-items:end; margin-top:14px}
.replying + .compose{margin-top:6px}
.compose textarea{font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; min-height:48px; resize:none; width:100%; line-height:1.4}
.send{width:48px; height:48px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center}
.send .ic{width:22px; height:22px; stroke-width:2.2}
.fr-line{display:grid; grid-template-columns:minmax(0,1fr) auto auto 20px; align-items:baseline; gap:10px; width:100%; background:var(--accent-soft); border:0; border-radius:var(--r-md); padding:12px 12px 12px 14px; color:inherit; text-align:left; margin-bottom:-8px}
.fr-line span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}
.fr-line b{font:var(--num-w) 1.05rem var(--num); white-space:nowrap}
.fr-line .muted{font-size:.82rem; white-space:nowrap}
.fr-line .ic{align-self:center; color:var(--accent)}
.sheet h3{font-size:.85rem; color:var(--muted); font-weight:650}
.fr-set{display:grid; gap:10px; border-top:1px solid var(--line); padding-top:14px}
.fr-set:first-of-type{border-top:0; padding-top:0}
.fr-set h3{font-size:.85rem; color:var(--muted); font-weight:650}
.sheet .fr-set #fr-code{font-size:1.4rem; letter-spacing:.2em; text-transform:uppercase; text-align:center}
.fr-alone{display:grid; gap:10px}
.fr-alone h2{font-size:1.15rem}
.fr-alone .bigcode{padding:4px 0}
.panel.empty .fr-form{width:100%; text-align:left}
.rules{display:grid; gap:8px}
.rule{display:grid; gap:3px; text-align:left; background:var(--bg); border:1.5px solid var(--line); border-radius:var(--r-md); padding:12px 14px; color:inherit}
.rule b{font-weight:700}
.rule span{font-size:.88rem}
.rule small{font-size:.76rem; color:var(--muted); line-height:1.4}
.rule.on{border-color:var(--accent); background:var(--accent-soft)}
.rule:disabled{opacity:1; cursor:default}
.rule:disabled:not(.on){opacity:.6}
.fr-who h2 small{font-family:var(--font); font-size:.8rem; font-weight:600}
.fr-who .kid{border-radius:var(--r-lg)}
.fr-reading{font-size:.95rem}
.fr-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center}
.fr-days div{display:grid; grid-template-rows:auto 64px auto auto; gap:4px; justify-items:center; font-size:.72rem; color:var(--muted)}
.fr-days i{align-self:end; width:18px; height:var(--h); min-height:0; border-radius:4px 4px 2px 2px; background:var(--under)}
.fr-days .read i{background:var(--good)}
.fr-days .open i{background:var(--accent); opacity:.6}
.fr-days b{font:var(--num-w) .9rem var(--num); color:var(--fg)}
.fr-days .miss b{color:var(--mark)}
.fr-days .future,.fr-days .before{opacity:.45}
/* ratings (stars, finished books) and favourites (heart); --rate is the stars' amber */
.stars{display:inline-flex; gap:1px; vertical-align:middle; color:var(--rate)}
.stars i{display:block; width:13px; height:13px; line-height:0; color:var(--surface2)}
.stars i.on{color:var(--rate)}
.stars svg,.favmark svg{width:100%; height:100%; fill:currentColor}
.favmark{display:inline-block; width:14px; height:14px; color:var(--mark); vertical-align:-1px; margin-left:6px; line-height:0}
.shelf .stars{margin-top:-2px}
.shelf-fav{position:absolute; top:8px; left:8px; display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.18)}
.shelf-fav .favmark{margin:0}
.rate{display:flex; gap:0}
.rate button{display:grid; place-items:center; width:44px; height:44px; background:none; border:0; padding:0; border-radius:8px; color:var(--surface2); transition:transform .15s var(--ease)}
.rate button svg{width:32px; height:32px; fill:currentColor}
.rate button.on{color:var(--rate)}
.rate button:active{transform:scale(.9)}
.favbtn{display:inline-flex; align-items:center; gap:8px; min-height:44px; background:none; border:1px solid var(--line); border-radius:var(--r-pill); padding:6px 16px 6px 12px; font-weight:650; color:var(--fg)}
.favbtn svg{width:20px; height:20px; fill:none; stroke:var(--mark); stroke-width:2}
.favbtn.on{background:var(--mark-soft); border-color:transparent; color:var(--mark)}
.favbtn.on svg{fill:var(--mark)}
.myrate{display:grid; gap:10px; justify-items:start}
.myrate-row{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px}
.myrate-row > span{font-size:.85rem; color:var(--muted); font-weight:600}
.finrate{display:grid; gap:10px}
.finrate h3{font-size:1rem}
.finrate-pick{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.finrate .hint{margin-top:0}
.party-rate{display:flex; align-items:center; gap:10px}
.party .party-rate .stars i{width:22px; height:22px}
.party .party-rate .favmark{width:22px; height:22px; margin:0}
.ev-rate{display:inline-flex; align-items:center; gap:4px; margin-left:6px; vertical-align:-2px}
.ev-rate .favmark{margin-left:2px}
/* a profile's books: reading now, favourites, read with ratings */
.fr-books{display:grid; gap:8px}
.fr-books h3{display:flex; align-items:baseline; gap:8px; font-family:var(--display); font-weight:var(--display-w); font-size:1.05rem; margin-top:6px}
.fr-books h3 span{font-family:var(--font); font-weight:500; font-size:.85rem; color:var(--muted)}
.fr-books .hint{margin-top:0}
.fr-books .link{justify-self:start; padding-left:0}
.blist{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.blist li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.bl-main{display:grid; gap:1px; min-width:0}
.bl-main b{font-weight:650; overflow-wrap:anywhere}
.bl-main small{font-size:.8rem; color:var(--muted); overflow-wrap:anywhere}
.bl-side{display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:3px 6px; flex:none; max-width:112px}
.bl-side small{flex-basis:100%; text-align:right; font-size:.75rem; color:var(--muted); white-space:nowrap}
.bl-side .favmark{margin:0}
@keyframes livepulse{0%,100%{opacity:1} 50%{opacity:.35}}
@media (hover:hover){.fr-row:hover .fr-name b{text-decoration:underline; text-underline-offset:3px} .bravo:hover,.re-btn:hover{color:var(--fg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important; transition:none!important} .morph .old,.morph .burst{display:none}}
@media (hover:hover){.btn:hover{filter:brightness(1.05)} .book:hover h3{text-decoration:underline; text-underline-offset:3px} .shelf:hover .cover{transform:translateY(-2px)} .tabs button:hover{color:var(--fg)}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Danes</button>
  <button data-act="tab" data-tab="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 6.5C10 5 6.5 4.5 3.5 5v13c3-.5 6.5 0 8.5 1.5 2-1.5 5.5-2 8.5-1.5V5c-3-.5-6.5 0-8.5 1.5zM12 6.5v13"/></svg>Knjige</button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>Napredek</button>
  <button data-act="tab" data-tab="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.3"/><path d="M3 19.5c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3"/><path d="M15.2 5.6a3.2 3.2 0 010 6M17.5 14.6c2 .7 3.2 2.4 3.5 4.9"/></svg>Prijatelji</button>
</nav>

<section class="reader" id="reader" hidden>
  <div class="rd-top"><span id="rd-cover"></span><span class="live" id="rd-live"><i></i><span id="rd-livetxt">Bereš</span></span><p class="rd-book" id="rd-book"></p></div>
  <div class="rd-ring">
    <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="ticks" cx="60" cy="60" r="48"/><circle class="arc" id="rd-arc" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/></svg>
    <div class="rd-mid"><b id="rd-clock">0:00</b><span id="rd-state">to branje</span></div>
  </div>
  <div style="display:grid; gap:20px; justify-items:center; width:100%">
    <p class="rd-today" id="rd-today"></p>
    <div class="btns two" id="rd-run"><button class="btn" data-act="pause">Premor</button><button class="btn primary" data-act="finish">Končano</button></div>
    <p class="rd-note" id="rd-note" hidden>Zaslon lahko ugasneš, štoparica šteje naprej.</p>
    <div class="rd-box" id="rd-paused" hidden>
      <p id="rd-why"></p>
      <div class="btns two"><button class="btn primary" data-act="resume">Nadaljuj</button><button class="btn" data-act="finish">Shrani in končaj</button></div>
      <button class="link" data-act="discard">Zavrzi to branje</button>
    </div>
  </div>
  <div class="rd-ask" id="rd-ask" hidden>
    <p>Še bereš?</p>
    <button class="btn primary" data-act="still">Ja, še berem</button>
    <small>Če v treh minutah nihče ne odgovori, se štoparica ustavi v trenutku, ko se je pojavilo to vprašanje.</small>
  </div>
  <div class="rd-ask" id="rd-back" hidden role="dialog" aria-modal="true" aria-labelledby="rd-back-q" aria-describedby="rd-back-t">
    <span class="rd-lead" id="rd-back-t"></span>
    <p id="rd-back-q">Si bral ves čas?</p>
    <div class="btns" id="rd-back-btns"></div>
    <small id="rd-back-n"></small>
  </div>
  <button class="rd-black" data-act="unblack" aria-label="Pokaži štoparico"><span id="rd-dim" aria-hidden="true"></span></button>
</section>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="party" id="party" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="f-import" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="kid.js"></script>
<script src="club.js"></script>
<script src="app.js"></script>
</body>
</html>
