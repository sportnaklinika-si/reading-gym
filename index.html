<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Gym</title>
<meta name="description" content="Time your reading, keep a streak, level up.">
<meta name="theme-color" content="#0E1217">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* One dark look on purpose: it is read at night next to a book. Amber is the reading lamp, green only means "goal done". */
:root{
  --bg:#0E1217; --card:#161C24; --card2:#1C2430; --line:#263040; --fg:#E8EDF2; --muted:#8D99A8; --faint:#5B6878;
  --lamp:#F0B848; --lamp-dim:#3A2F17; --tick:#5CC488; --warn:#E8735A;
  --bronze:#C98B5A; --silver:#B9C3CF; --gold:#F0B848;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --round:"SF Pro Rounded", ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
  --top:env(safe-area-inset-top, 0px); --bot:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 var(--font); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body{min-height:100vh; min-height:100dvh}
button,input{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--lamp); outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--round); line-height:1.15; text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

main{max-width:560px; margin:0 auto; padding:calc(var(--top) + 18px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 96px) max(16px, env(safe-area-inset-left, 0px)); display:grid; gap:16px}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px}
.sec{font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:var(--font); font-weight:600; margin-top:6px}

/* buttons */
.btn{border:1px solid var(--line); background:var(--card2); border-radius:14px; padding:13px 16px; font-weight:600; text-align:center; width:100%}
.btn.primary{background:var(--lamp); border-color:var(--lamp); color:#14110A}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn); background:transparent}
.btn.armed{background:var(--warn); border-color:var(--warn); color:#140A08}
.btns{display:grid; gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.link{background:none; border:0; color:var(--muted); text-decoration:underline; padding:8px}

/* level header */
.lvl{display:grid; grid-template-columns:64px minmax(0,1fr); gap:14px; align-items:center; background:none; border:0; padding:0; text-align:left; width:100%}
.eyebrow{font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.lvl h1{font-size:1.55rem; margin:2px 0 8px}
.bar{height:8px; border-radius:99px; background:var(--card2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--lamp); border-radius:99px}
.sub{font-size:.85rem; color:var(--muted); margin-top:6px}

/* today */
.today{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center}
.today h2{font-size:1.25rem}
.today p{color:var(--muted)}
.ring .trk{fill:none; stroke:var(--card2); stroke-width:7}
.ring .arc{fill:none; stroke:var(--lamp); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .6s}
.ring .arc.done{stroke:var(--tick)}
.ring .chk{fill:none; stroke:var(--tick); stroke-width:5; stroke-linecap:round; stroke-linejoin:round}
.ring text{fill:var(--fg); font:700 17px var(--round)}
.ring text.u{fill:var(--muted); font:500 8px var(--font)}

/* streak */
.streak-top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.streak-top b{font:700 2rem/1 var(--round)}
.marks{display:flex; gap:6px; margin-left:auto; align-items:center}
.mark{width:14px; height:20px; border:1.5px solid var(--faint); border-radius:2px; clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.mark.on{background:var(--lamp); border-color:var(--lamp)}
.hint{font-size:.85rem; color:var(--muted); margin-top:4px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px}
.wd{display:grid; justify-items:center; gap:5px; font-size:.72rem; color:var(--muted)}
.dot{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center}
.dot.tick{background:var(--tick); border-color:var(--tick)}
.dot.saved{border-color:var(--lamp)}
.dot.miss{border-style:dashed}
.dot.open{border-color:var(--muted)}
.dot svg{width:16px; height:16px}
.wd.is-today{color:var(--fg); font-weight:700}

/* books */
.books{display:grid; gap:10px}
.book{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; text-align:left; width:100%}
.book h3{font-size:1rem; overflow-wrap:anywhere}
.book p{font-size:.85rem; color:var(--muted)}
.cover{border-radius:6px; object-fit:cover; background:var(--card2); display:grid; place-items:center; color:var(--lamp); font:700 1rem var(--round); flex:none; overflow:hidden}
.play{width:48px; height:48px; border-radius:50%; border:0; background:var(--lamp); color:#14110A; display:grid; place-items:center}
.play svg{width:20px; height:20px; margin-left:3px}
.add{border:1.5px dashed var(--line); background:transparent; border-radius:16px; padding:16px; color:var(--lamp); font-weight:600; width:100%}
.empty{text-align:center; display:grid; gap:12px; padding:22px 16px}
.empty p{color:var(--muted)}
.tag{font-size:.72rem; border:1px solid var(--line); border-radius:99px; padding:2px 8px; color:var(--muted); white-space:nowrap}

/* install */
.install{background:var(--lamp-dim); border-color:var(--lamp); display:grid; gap:8px}
.install p{font-size:.92rem}

/* stats */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px}
.tile b{display:block; font:700 1.5rem/1.1 var(--round); font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem; color:var(--muted)}
.chart svg{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font:500 11px var(--font)}
.chart .v{fill:var(--fg); font-weight:600}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.cal-head button{background:none; border:1px solid var(--line); border-radius:10px; width:40px; height:36px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.cal .h{font-size:.7rem; color:var(--muted); padding-bottom:2px}
.cal .c{aspect-ratio:1; border-radius:10px; display:grid; place-items:center; font-size:.85rem; font-variant-numeric:tabular-nums; color:var(--muted); max-width:100%}
.cal .c.tick{background:var(--tick); color:#08130D; font-weight:700}
.cal .c.saved{box-shadow:inset 0 0 0 1.5px var(--lamp); color:var(--lamp)}
.cal .c.miss{color:var(--faint)}
.cal .c.open,.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--muted); color:var(--fg)}
.cal .c.future{opacity:.35}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:.78rem; color:var(--muted); margin-top:10px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.ladder{display:grid; gap:6px}
.rung{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; padding:6px 8px; border-radius:12px}
.rung.now{background:var(--card2); box-shadow:inset 0 0 0 1px var(--lamp)}
.rung.locked{color:var(--faint)}
.rung b{font-family:var(--round)}
.rung small{color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.goal{display:grid; grid-template-columns:48px minmax(0,1fr) 48px; gap:10px; align-items:center; text-align:center}
.goal button{height:48px; border-radius:14px; border:1px solid var(--line); background:var(--card2); font-size:1.4rem}
.goal b{font:700 1.6rem var(--round)}
.row{display:flex; gap:10px; align-items:center; justify-content:space-between}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; grid-template-columns:repeat(3,1fr); background:rgba(14,18,23,.94); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 6px) max(8px, env(safe-area-inset-left, 0px))}
.tabs button{background:none; border:0; display:grid; justify-items:center; gap:2px; font-size:.72rem; color:var(--muted); padding:6px 0}
.tabs button[aria-current="page"]{color:var(--lamp)}
.tabs svg{width:24px; height:24px}

/* bottom sheet */
.scrim{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:560px; max-height:92vh; max-height:92dvh; overflow:auto; padding:20px max(16px, env(safe-area-inset-right, 0px)) calc(var(--bot) + 20px) max(16px, env(safe-area-inset-left, 0px)); display:grid; gap:14px; border:1px solid var(--line); border-bottom:0}
.sheet h2{font-size:1.3rem}
.sheet label{display:grid; gap:6px; font-size:.85rem; color:var(--muted)}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:1rem; color:var(--fg); width:100%}
.photo{border:1.5px dashed var(--line); border-radius:14px; padding:14px; display:flex!important; align-items:center; gap:14px; color:var(--lamp)!important; font-weight:600; cursor:pointer}
.photo img{width:64px; height:92px; object-fit:cover; border-radius:6px}
.err{color:var(--warn); font-size:.9rem}
.detail{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center}
.detail h2{overflow-wrap:anywhere}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0}
.facts div{background:var(--bg); border-radius:12px; padding:10px 12px}
.facts dt{font-size:.75rem; color:var(--muted)}
.facts dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums}
.sheet-close{justify-self:end; background:none; border:0; color:var(--muted); padding:4px 0 0}

/* reading screen: near black so the screen can stay on beside the book */
.reader{position:fixed; inset:0; z-index:40; background:#000; color:#9AA4B0; display:grid; grid-template-rows:auto 1fr auto; justify-items:center; align-items:center; gap:24px; text-align:center; padding:calc(var(--top) + 24px) 24px calc(var(--bot) + 32px)}
.rd-top{display:grid; gap:6px; max-width:100%}
.rd-book{font:600 1.05rem var(--round); color:#C6CED8; overflow-wrap:anywhere}
.rd-ring{position:relative; width:min(72vw, 300px); aspect-ratio:1}
.rd-ring svg{width:100%; height:100%}
.rd-ring .trk{fill:none; stroke:#141A21; stroke-width:5}
.rd-ring .arc{fill:none; stroke:#8A6A2A; stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 1s linear}
.rd-ring .arc.done{stroke:#2F7A50}
.rd-mid{position:absolute; inset:0; display:grid; place-content:center; gap:4px}
.rd-mid b{font:600 clamp(2.6rem, 14vw, 4.2rem)/1 var(--round); color:#C6CED8; font-variant-numeric:tabular-nums}
.rd-mid span{font-size:.85rem; color:#6B7684}
.rd-today{font-size:.95rem}
.rd-today.done{color:#5CC488}
.reader .btns{width:min(100%, 360px)}
.reader .btn{background:#0D1116; border-color:#1E2630; color:#AEB8C4}
.reader .btn.primary{background:#2A2112; border-color:#5C4720; color:#F0C66A}
.rd-box{display:grid; gap:14px; width:min(100%, 360px)}
.rd-box p{color:#C6CED8}
.rd-ask{position:absolute; inset:0; background:rgba(0,0,0,.92); display:grid; place-content:center; gap:16px; padding:24px}
.rd-ask p{font:700 1.6rem var(--round); color:#E8EDF2}
.rd-ask small{color:#6B7684; max-width:30ch; justify-self:center}

/* toast + level up */
.toast{position:fixed; left:50%; bottom:calc(var(--bot) + 86px); transform:translateX(-50%); z-index:60; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 16px; width:max-content; max-width:calc(100% - 32px); box-shadow:0 8px 30px rgba(0,0,0,.4); animation:up .25s ease-out}
.party{position:fixed; inset:0; z-index:70; background:#07090C; display:grid; place-content:center; justify-items:center; gap:14px; text-align:center; padding:24px}
.party p{max-width:32ch}
.party .badge{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.party h2{font-size:2rem}
.party p{color:var(--muted)}
@keyframes up{from{opacity:0; transform:translate(-50%, 10px)}}
@keyframes pop{from{transform:scale(.3) rotate(-25deg); opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
  <button data-act="tab" data-tab="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6.5C10 5 6.5 4.5 3.5 5v13c3-.5 6.5 0 8.5 1.5 2-1.5 5.5-2 8.5-1.5V5c-3-.5-6.5 0-8.5 1.5zM12 6.5v13"/></svg>Books</button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>Stats</button>
</nav>

<section class="reader" id="reader" hidden>
  <div class="rd-top"><span class="muted" style="font-size:.8rem">Reading</span><p class="rd-book" id="rd-book"></p></div>
  <div class="rd-ring">
    <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="arc" id="rd-arc" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/></svg>
    <div class="rd-mid"><b id="rd-clock">0:00</b><span id="rd-state">this session</span></div>
  </div>
  <div style="display:grid; gap:20px; justify-items:center; width:100%">
    <p class="rd-today" id="rd-today"></p>
    <div class="btns two" id="rd-run"><button class="btn" data-act="pause">Pause</button><button class="btn primary" data-act="finish">Done</button></div>
    <div class="rd-box" id="rd-paused" hidden>
      <p id="rd-why"></p>
      <div class="btns two"><button class="btn primary" data-act="resume">Continue</button><button class="btn" data-act="finish">Save and stop</button></div>
      <button class="link" data-act="discard">Throw this session away</button>
    </div>
  </div>
  <div class="rd-ask" id="rd-ask" hidden>
    <p>Still reading?</p>
    <button class="btn primary" data-act="still">Yes, still reading</button>
    <small>If nobody answers within 3 minutes, the timer stops at the moment this question appeared.</small>
  </div>
</section>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="party" id="party" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="f-import" accept="application/json,.json" hidden>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
