<!doctype html>
<!-- Draws the app icon for a PNG screenshot (see icons/make-icons.sh). ?m adds the safe margin a maskable Android icon needs. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0E1217;overflow:hidden}img{display:block;width:100vw;height:100vh}</style></head>
<body><img id="i" src="icon.svg" alt="">
<script>if (location.search.includes('m')) { const i = document.getElementById('i'); i.style.transform = 'scale(.8)'; }</script>
</body></html>
