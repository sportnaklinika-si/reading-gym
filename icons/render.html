<!doctype html>
<!-- Draws the app icon for a PNG screenshot (see icons/make-icons.sh). ?m shrinks the artwork, not the background, to the safe zone a maskable Android icon needs. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0B1024;overflow:hidden}svg{display:block;width:100vw;height:100vh}</style></head>
<body>
<script>
fetch('icon.svg').then(r => r.text()).then(t => {
  document.body.innerHTML = t;
  if (location.search.includes('m')) document.getElementById('art').setAttribute('transform', 'translate(10 10) scale(.8)');
});
</script>
</body></html>
