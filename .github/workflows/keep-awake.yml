# Bralni mentor 2: a daily check that the friends' server answers over HTTPS (it also notices an expired certificate).
# If it fails, GitHub e-mails the repository owner. The address comes from v2/config.js; while it is empty, this does nothing.
name: Check the friends' server
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call bm_ping
        run: |
          URL=$(sed -n "s/.*url: '\([^']*\)'.*/\1/p" v2/config.js)
          KEY=$(sed -n "s/.*key: '\([^']*\)'.*/\1/p" v2/config.js)
          if [ -z "$URL" ]; then echo "No server in v2/config.js yet."; exit 0; fi
          curl -fsS --max-time 20 -X POST "$URL/rpc/bm_ping" ${KEY:+-H "apikey: $KEY"} -H "Content-Type: application/json" -d '{}'
