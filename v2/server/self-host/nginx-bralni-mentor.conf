# Bralni mentor: HTTPS for the friends' API at https://__IP__:8443/ (the server's IP address, no domain name needed).
# Installed by cert.sh as /etc/nginx/sites-available/bralni-mentor. It stays out of the websites' way:
# - port 8443 is used only by this app;
# - the port-80 block answers only for the bare IP address (Let's Encrypt checks the certificate there); requests for any
#   website name (www.sportnaklinika.si ...) go to that website's own server block as before.
# Remove: rm /etc/nginx/sites-enabled/bralni-mentor && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=bralni:10m rate=10r/s;

server {
    listen 80;
    server_name __IP__;
    location /.well-known/acme-challenge/ { root /var/www/bralni-acme; }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name __IP__;
    ssl_certificate     /etc/bralni-mentor/cert/fullchain.pem;
    ssl_certificate_key /etc/bralni-mentor/cert/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;          # the cloud copy of a reading log can be up to 3 MB
    location /rpc/ {
        limit_req zone=bralni burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
