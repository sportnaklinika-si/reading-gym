# Bralni mentor: the friends' server on our own machine, apart from everything else on it.
# Postgres keeps the data (not reachable from outside), PostgREST turns the bm_* functions in ../schema.sql into the web
# API on 127.0.0.1 only (the web server in front of it adds HTTPS), and a small loop dumps the database every night.
# Started and updated by install.sh; the passwords are in .env (made by install.sh, never in git).
name: bralni-mentor
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run install.sh}
    volumes:
      - db:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 10s
      retries: 12
  api:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${API_PASSWORD:?run install.sh}@db:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public
      PGRST_DB_POOL: 5
      PGRST_OPENAPI_MODE: disabled
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    mem_limit: 128m
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGPASSWORD: ${DB_PASSWORD:?run install.sh}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    mem_limit: 64m
volumes:
  db:
